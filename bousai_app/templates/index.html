{% extends "base.html" %}

{% block title %}ホーム | 防災アプリ{% endblock %}

{% block content %}
<style>
    .home-card + .home-card { margin-top: 34px; }

    .section-heading {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 20px;
        color: var(--blue);
        font-size: 21px;
        font-weight: 800;
    }

    .section-heading .icon { font-size: 24px; line-height: 1; }

    .section-heading h2 { margin: 0; font-size: inherit; }

    .map-frame {
        height: 365px;
        overflow: hidden;
        border-radius: 12px;
        background: #d7edf2;
    }

    #shelterMap { width: 100%; height: 100%; }

    .weather-heading { justify-content: space-between; }

    .auto-refresh {
        color: #2ba34f;
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
    }

    .weather-content {
        min-height: 148px;
        padding: 18px;
        border-radius: 12px;
        background: #f7f8fa;
    }

    .weather-content p { margin: 0 0 10px; }
    .weather-content p:last-child { margin-bottom: 0; }

    .weather-location { font-weight: 700; }

    .weather-status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #229a49;
        font-size: 17px;
        font-weight: 800;
    }

    .weather-status::before {
        content: '✓';
        display: inline-grid;
        width: 19px;
        height: 19px;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: #2ca650;
        font-size: 13px;
    }

    .weather-meta { color: var(--muted); font-size: 13px; }

    .weather-list { margin: 8px 0 12px; padding-left: 22px; }

    @media (max-width: 640px) {
        .section-heading { font-size: 18px; }
        .map-frame { height: 290px; }
        .weather-heading { align-items: flex-start; }
        .auto-refresh { font-size: 12px; }
    }
</style>

<section class="card home-card" aria-labelledby="map-title">
    <h2 class="section-heading" id="map-title"><span class="icon" aria-hidden="true">⌖</span>避難所マップ</h2>
    <div class="map-frame">
        <div id="shelterMap" aria-label="避難所マップ"></div>
    </div>
</section>

<section class="card home-card" aria-labelledby="weather-title">
    <div class="section-heading weather-heading">
        <h2 id="weather-title"><span class="icon" aria-hidden="true">☁</span>青森市 気象警報・注意報</h2>
        <span class="auto-refresh" aria-label="10分おきに自動更新">↻ 10分おき自動更新</span>
    </div>
    <div class="weather-content" id="weatherContent">
        <p>読み込み中...</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（藤沢市周辺を中心に設定）
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました。</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-status">現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location">⌖ ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta">◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta">⌁ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
